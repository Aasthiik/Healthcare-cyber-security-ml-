name: hc-ml-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy=1.24
  - pandas=2.0
  - scikit-learn=1.6
  - flask=2.3
  - pip
  - pip:
    - joblib>=1.1
    - requests>=2.28
    - pyshark>=0.4.2
    - python-pptx>=1.0

# Usage:
# 1) conda env create -f environment.yml
# 2) conda activate hc-ml-env
# 3) python app.py
